<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEPTUN AR Lock-on Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://neptun.in.ua/sdk/neptun.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #cameraFeed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        @keyframes alertFlash {
            0% { box-shadow: inset 0 0 0px rgba(255,0,0,0); }
            50% { box-shadow: inset 0 0 50px rgba(255,0,0,0.8); border: 2px solid red; }
            100% { box-shadow: inset 0 0 0px rgba(255,0,0,0); }
        }
        .locked-on { animation: alertFlash 0.5s infinite; }

        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
            transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; transition: border-color 0.2s;
        }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.5); }
        .crosshair::before { top: 50%; left: -10px; width: 80px; height: 2px; margin-top: -1px; }
        .crosshair::after { left: 50%; top: -10px; width: 2px; height: 80px; margin-left: -1px; }
        .crosshair.active { border-color: red; }
        .crosshair.active::before, .crosshair.active::after { background: red; }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 4rem; color: red; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none; animation: pulse 1s infinite;
        }
        .nav-arrow.left { left: 20px; }
        .nav-arrow.right { right: 20px; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        
        /* Стилізація повзунків */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 14px; height: 14px; border-radius: 50%; 
            background: #3b82f6; cursor: pointer;
        }
        input[type=range]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%; 
            background: #3b82f6; cursor: pointer; border: none;
        }
    </style>
</head>
<body class="text-white relative">

    <video id="cameraFeed" autoplay playsinline></video>

    <div id="uiLayer" class="relative w-full h-full border-box">
        <div id="crosshair" class="crosshair"></div>
        <div id="arrowLeft" class="nav-arrow left">←</div>
        <div id="arrowRight" class="nav-arrow right">→</div>

        <!-- Оновлений HUD -->
        <div id="targetHUD" class="absolute top-[55%] left-1/2 -translate-x-1/2 bg-black/85 border border-red-500 rounded-lg p-4 w-[90%] max-w-sm hidden flex-col items-center shadow-[0_0_20px_rgba(255,0,0,0.7)]">
            <div id="hudIcon" class="text-4xl mb-1">🎯</div>
            <div id="hudTitle" class="text-red-500 font-bold text-xl uppercase tracking-wider text-center mb-3 border-b border-gray-700 w-full pb-2">Ціль</div>

            <!-- Таблиця телеметрії -->
            <div class="grid grid-cols-[80px_1fr] gap-x-4 gap-y-2 w-full text-sm">
                <div class="text-gray-400">Локація:</div> <div id="hudLoc" class="font-bold text-right text-white truncate w-full">--</div>
                <div class="text-gray-400">Курс:</div> <div id="hudCourse" class="font-bold text-right text-amber-400 truncate w-full text-[12px]">--</div>
                <div class="text-gray-400">Відстань:</div> <div id="hudDist" class="font-mono font-bold text-right text-white">--</div>
                <div class="text-gray-400">Швидкість:</div> <div id="hudSpeed" class="font-mono font-bold text-right text-white">--</div>
                <div class="text-gray-400">Кількість:</div> <div id="hudCount" class="font-mono font-bold text-right text-white">--</div>
                <div class="text-gray-400">Похибка:</div> <div id="hudAccuracy" class="font-mono font-bold text-right text-white">--</div>
            </div>
        </div>

        <div class="absolute top-4 left-4 pointer-events-auto flex flex-col gap-2">
            <button id="btnSimulate" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-lg shadow-lg">
                Симулювати (15км)
            </button>
            <div id="debugInfo" class="bg-black/60 text-[10px] p-2 rounded max-w-[150px] font-mono opacity-70">
                Очікування старту...
            </div>
        </div>

        <!-- Міні-карта та Панель управління (Верхній правий кут) -->
        <div class="absolute top-4 right-4 flex flex-col items-end gap-2 pointer-events-auto">
            <div class="w-32 h-32 bg-black/60 border border-slate-700 rounded-full shadow-lg overflow-hidden backdrop-blur-md relative pointer-events-none">
                <canvas id="radarCanvas" width="128" height="128" class="w-full h-full"></canvas>
            </div>
            
            <div class="flex flex-col gap-3 w-32 bg-black/60 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                <!-- Зум радара -->
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400 font-mono mb-1">
                        <span>🔍</span><span id="radarLabel">50 км</span>
                    </div>
                    <input type="range" id="radarZoom" min="5" max="1000" value="50" step="5" class="w-full h-1 bg-gray-600 rounded-lg appearance-none outline-none">
                </div>
                <!-- Кут огляду (FOV) -->
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400 font-mono mb-1">
                        <span>👁 FOV</span><span id="fovLabel">30°</span>
                    </div>
                    <input type="range" id="fovSlider" min="10" max="120" value="30" step="5" class="w-full h-1 bg-gray-600 rounded-lg appearance-none outline-none">
                </div>
            </div>
        </div>
    </div>

    <!-- Екран дозволів -->
    <div id="permissionScreen" class="absolute inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-2xl font-bold mb-4">NEPTUN AR Radar</h1>
        <p class="text-sm text-slate-300 mb-6 max-w-sm">Для роботи системи необхідний доступ до компаса, камери та GPS.</p>
        <button id="btnStart" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg w-full max-w-sm">
            Надати дозволи та Почати
        </button>
        <p id="errorMsg" class="text-red-400 mt-4 text-xs font-mono break-words"></p>
    </div>

    <script>
        window.onerror = function(msg) { alert(`ПОМИЛКА: ${msg}`); return false; };
        
        let myLat = 0, myLon = 0, phoneHeading = 0;
        let activeThreats = [], fakeTarget = null, isLocked = false;
        let audioCtx = null, lastBeep = 0, client = null;

        const uiLayer = document.getElementById('uiLayer');
        const crosshair = document.getElementById('crosshair');
        const targetHUD = document.getElementById('targetHUD');
        const arrowLeft = document.getElementById('arrowLeft');
        const arrowRight = document.getElementById('arrowRight');
        const debugInfo = document.getElementById('debugInfo');
        
        // Налаштування Canvas
        const radarCanvas = document.getElementById('radarCanvas');
        const ctx = radarCanvas.getContext('2d');
        const cx = radarCanvas.width / 2;
        const cy = radarCanvas.height / 2;
        const radarRadius = cx - 10; 
        
        // Повзунки
        let maxRadarKm = 50; 
        let currentFov = 30; // Загальний кут огляду в градусах
        
        document.getElementById('radarZoom').addEventListener('input', (e) => {
            maxRadarKm = parseInt(e.target.value);
            document.getElementById('radarLabel').textContent = maxRadarKm + ' км';
        });
        document.getElementById('fovSlider').addEventListener('input', (e) => {
            currentFov = parseInt(e.target.value);
            document.getElementById('fovLabel').textContent = currentFov + '°';
        });

        window.addEventListener('deviceorientation', (e) => { if (e.webkitCompassHeading !== undefined) phoneHeading = e.webkitCompassHeading; }, true);
        window.addEventListener('deviceorientationabsolute', (e) => { if (e.alpha !== null) phoneHeading = (360 - e.alpha) % 360; }, true);

        function playAlertBeep() {
            if (!audioCtx || audioCtx.currentTime - lastBeep < 0.5) return;
            lastBeep = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const toRad = Math.PI / 180, toDeg = 180 / Math.PI;
            const dLon = (lon2 - lon1) * toRad;
            const y = Math.sin(dLon) * Math.cos(lat2 * toRad);
            const x = Math.cos(lat1 * toRad) * Math.sin(lat2 * toRad) - Math.sin(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.cos(dLon);
            return (Math.atan2(y, x) * toDeg + 360) % 360;
        }

        document.getElementById('btnStart').addEventListener('click', async () => {
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') throw new Error("Компасу відмовлено");
                }

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('cameraFeed').srcObject = stream;

                navigator.geolocation.watchPosition(
                    (pos) => { myLat = pos.coords.latitude; myLon = pos.coords.longitude; },
                    (err) => { alert("GPS: " + err.message); }, { enableHighAccuracy: true }
                );

                client = new NEPTUN.RealtimeClient("https://neptun.in.ua");
                client.subscribe((snap) => {
                    activeThreats = snap.threats.filter(t => !t.areaOnly && t.status !== 'resolved');
                });
                client.start();

                document.getElementById('permissionScreen').style.display = 'none';
                requestAnimationFrame(renderLoop);
            } catch (e) { document.getElementById('errorMsg').textContent = e.message; }
        });

        document.getElementById('btnSimulate').addEventListener('click', () => {
            if (myLat === 0) return alert("Чекаємо GPS...");
            const targetPos = NEPTUN.dest(myLat, myLon, phoneHeading, 15); 
            const nowIso = new Date().toISOString();
            const headingToMe = (phoneHeading + 180) % 360;
            fakeTarget = {
                id: 'sim_1', type: 'missile', lat: targetPos.lat, lon: targetPos.lon,
                heading: headingToMe, velocity: { speedKmh: 800, bearingDeg: headingToMe }, 
                title: "СИМУЛЯЦІЯ (Ракета)", explanationShort: "Навчальна ракета курсом на вас",
                locality: "Ваш сектор", region: "Тестова область",
                count: 1, uncertaintyKm: 2, updatedAt: nowIso, confirmedAt: nowIso, status: 'active'
            };
            setTimeout(() => { fakeTarget = null; }, 30000);
        });

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            if (myLat === 0) return;

            const now = Date.now();
            let allThreats = [...activeThreats];
            if (fakeTarget) allThreats.push(fakeTarget);

            let closestInFov = null;
            let minDistInFov = Infinity;
            let closestOverall = null;
            let minDistOverall = Infinity;
            
            const halfFov = currentFov / 2;
            
            ctx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
            
            // Сітка
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(cx, cy, radarRadius * 0.5, 0, 2 * Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, radarRadius, 0, 2 * Math.PI); ctx.stroke();

            // Конус зору (динамічний)
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radarRadius, -Math.PI/2 - (halfFov * Math.PI/180), -Math.PI/2 + (halfFov * Math.PI/180));
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fill();

            // Точка користувача
            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
            ctx.fillStyle = '#3b82f6';
            ctx.fill();

            for (const t of allThreats) {
                const p = NEPTUN.predict(t, now);
                if (!p || isNaN(p.lat)) continue; 
                
                const distKm = NEPTUN.distanceKm(myLat, myLon, p.lat, p.lon);
                const targetBearing = getBearing(myLat, myLon, p.lat, p.lon);
                let deltaAngle = ((targetBearing - phoneHeading + 540) % 360) - 180;
                
                let scale = distKm / maxRadarKm;
                if (scale > 1) scale = 1; 
                
                const rad = (deltaAngle - 90) * Math.PI / 180;
                const px = cx + (scale * radarRadius) * Math.cos(rad);
                const py = cy + (scale * radarRadius) * Math.sin(rad);
                
                const meta = NEPTUN.getTypeMeta(t.type) || { color: 'red' };
                
                ctx.beginPath();
                ctx.arc(px, py, 4, 0, 2 * Math.PI);
                ctx.fillStyle = meta.color;
                ctx.fill();
                
                // Збереження глобально найближчої цілі (для стрілок навігації)
                if (distKm < minDistOverall) {
                    minDistOverall = distKm; 
                    closestOverall = { threat: t, predicted: p, delta: deltaAngle };
                }
                
                // Збереження найближчої цілі У ПОЛІ ЗОРУ (для захоплення)
                if (Math.abs(deltaAngle) <= halfFov && distKm < minDistInFov) {
                    minDistInFov = distKm;
                    closestInFov = { threat: t, predicted: p, delta: deltaAngle, dist: distKm };
                }
            }

            debugInfo.innerHTML = `Азимут: ${Math.round(phoneHeading)}°<br>Цілей: ${allThreats.length}`;

            // ЛОГІКА ЗАХОПЛЕННЯ
            if (closestInFov) {
                // Якщо є ціль у полі зору - захоплюємо її
                if (!isLocked) {
                    isLocked = true;
                    uiLayer.classList.add('locked-on'); crosshair.classList.add('active');
                    targetHUD.classList.remove('hidden'); targetHUD.classList.add('flex');
                    arrowLeft.style.display = 'none'; arrowRight.style.display = 'none';
                }
                playAlertBeep();
                
                const t = closestInFov.threat;
                const meta = NEPTUN.getTypeMeta(t.type) || { color: 'red', title: 'Невідомо', icon: '❓' };
                
                document.getElementById('hudIcon').textContent = meta.icon;
                document.getElementById('hudIcon').style.color = meta.color;
                document.getElementById('hudTitle').textContent = t.title || meta.title;
                document.getElementById('hudTitle').style.color = meta.color;
                
                const locationText = t.locality || t.district || t.region || "Невідомо";
                document.getElementById('hudLoc').textContent = locationText;
                document.getElementById('hudCourse').textContent = t.explanationShort || "Невідомо";
                
                document.getElementById('hudDist').textContent = closestInFov.dist < 1 ? Math.round(closestInFov.dist * 1000) + ' м' : closestInFov.dist.toFixed(1) + ' км';
                document.getElementById('hudSpeed').textContent = (t.velocity && t.velocity.speedKmh) ? t.velocity.speedKmh + ' км/год' : 'Н/Д';
                document.getElementById('hudCount').textContent = t.count > 1 ? t.count + ' шт.' : '1 шт.';
                document.getElementById('hudAccuracy').textContent = t.uncertaintyKm ? '±' + t.uncertaintyKm + ' км' : 'Н/Д';
                
            } else if (closestOverall) {
                // Цілей у полі зору немає, але десь є - показуємо стрілки, куди крутитися
                resetUI();
                if (closestOverall.delta < 0) arrowLeft.style.display = 'block';
                else arrowRight.style.display = 'block';
            } else {
                // Цілей взагалі немає
                resetUI();
            }
        }

        function resetUI() {
            isLocked = false;
            uiLayer.classList.remove('locked-on'); crosshair.classList.remove('active');
            targetHUD.classList.add('hidden'); targetHUD.classList.remove('flex');
            arrowLeft.style.display = 'none'; arrowRight.style.display = 'none';
        }
    </script>
</body>
</html>
