<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEPTUN AR Lock-on Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://neptun.in.ua/sdk/neptun.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #cameraFeed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        @keyframes alertFlash {
            0% { box-shadow: inset 0 0 0px rgba(255,0,0,0); }
            50% { box-shadow: inset 0 0 50px rgba(255,0,0,0.8); border: 2px solid red; }
            100% { box-shadow: inset 0 0 0px rgba(255,0,0,0); }
        }
        .locked-on { animation: alertFlash 0.5s infinite; }

        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
            transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; transition: border-color 0.2s;
        }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.5); }
        .crosshair::before { top: 50%; left: -10px; width: 80px; height: 2px; margin-top: -1px; }
        .crosshair::after { left: 50%; top: -10px; width: 2px; height: 80px; margin-left: -1px; }
        .crosshair.active { border-color: red; }
        .crosshair.active::before, .crosshair.active::after { background: red; }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 4rem; color: red; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none; animation: pulse 1s infinite;
        }
        .nav-arrow.left { left: 20px; }
        .nav-arrow.right { right: 20px; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        
        /* Стилізація повзунка масштабу */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; border-radius: 50%; 
            background: #3b82f6; cursor: pointer;
        }
        input[type=range]::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%; 
            background: #3b82f6; cursor: pointer; border: none;
        }
    </style>
</head>
<body class="text-white relative">

    <video id="cameraFeed" autoplay playsinline></video>

    <div id="uiLayer" class="relative w-full h-full border-box">
        <div id="crosshair" class="crosshair"></div>
        <div id="arrowLeft" class="nav-arrow left">←</div>
        <div id="arrowRight" class="nav-arrow right">→</div>

        <!-- HUD (Інформаційна панель) -->
        <div id="targetHUD" class="absolute top-[55%] left-1/2 -translate-x-1/2 bg-black/85 border border-red-500 rounded-lg p-4 w-[90%] max-w-sm hidden flex-col items-center shadow-[0_0_20px_rgba(255,0,0,0.7)]">
            <div id="hudIcon" class="text-4xl mb-1">🎯</div>
            <div id="hudTitle" class="text-red-500 font-bold text-xl uppercase tracking-wider text-center">Ціль</div>
            <div id="hudDesc" class="text-xs text-amber-400 text-center mb-4 min-h-[32px] w-full border-b border-gray-700 pb-2">Аналіз сигнатури...</div>

            <div class="grid grid-cols-2 gap-x-6 gap-y-2 w-full text-sm">
                <div class="text-gray-400">Відстань:</div> <div id="hudDist" class="font-mono font-bold text-right text-white">--</div>
                <div class="text-gray-400">Швидкість:</div> <div id="hudSpeed" class="font-mono font-bold text-right text-white">--</div>
                <div class="text-gray-400">Кількість:</div> <div id="hudCount" class="font-mono font-bold text-right text-white">--</div>
                <div class="text-gray-400">Похибка:</div> <div id="hudAccuracy" class="font-mono font-bold text-right text-white">--</div>
            </div>
        </div>

        <!-- Кнопка симуляції та Дебаг -->
        <div class="absolute top-4 left-4 pointer-events-auto flex flex-col gap-2">
            <button id="btnSimulate" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-lg shadow-lg">
                Симулювати ціль (15км)
            </button>
            <div id="debugInfo" class="bg-black/60 text-[10px] p-2 rounded max-w-[150px] font-mono opacity-70">
                Очікування старту...
            </div>
        </div>

        <!-- МІНІ-КАРТА (РАДАР) ТА ПОВЗУНОК МАСШТАБУ (Верхній правий кут) -->
        <div class="absolute top-4 right-4 flex flex-col items-center gap-2 pointer-events-auto">
            <div class="w-32 h-32 bg-black/60 border border-slate-700 rounded-full shadow-lg overflow-hidden backdrop-blur-md relative pointer-events-none">
                <canvas id="radarCanvas" width="128" height="128" class="w-full h-full"></canvas>
                <div id="radarLabel" class="absolute bottom-2 w-full text-center text-[9px] text-gray-400 font-mono tracking-widest opacity-80">50 км</div>
            </div>
            <!-- Повзунок масштабу (від 5 до 500 км) -->
            <input type="range" id="radarZoom" min="5" max="500" value="50" step="5" class="w-24 h-1 bg-gray-600 rounded-lg appearance-none outline-none">
        </div>
    </div>

    <!-- Екран дозволів -->
    <div id="permissionScreen" class="absolute inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-2xl font-bold mb-4">NEPTUN AR Radar</h1>
        <p class="text-sm text-slate-300 mb-6 max-w-sm">Для роботи системи необхідний доступ до компаса, камери та GPS.</p>
        <button id="btnStart" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg w-full max-w-sm">
            Надати дозволи та Почати
        </button>
        <p id="errorMsg" class="text-red-400 mt-4 text-xs font-mono break-words"></p>
    </div>

    <script>
        window.onerror = function(msg) { alert(`ПОМИЛКА: ${msg}`); return false; };
        
        let myLat = 0, myLon = 0, phoneHeading = 0;
        let activeThreats = [], fakeTarget = null, isLocked = false;
        let audioCtx = null, lastBeep = 0, client = null;

        const uiLayer = document.getElementById('uiLayer');
        const crosshair = document.getElementById('crosshair');
        const targetHUD = document.getElementById('targetHUD');
        const arrowLeft = document.getElementById('arrowLeft');
        const arrowRight = document.getElementById('arrowRight');
        const debugInfo = document.getElementById('debugInfo');
        
        // Налаштування Canvas для міні-карти
        const radarCanvas = document.getElementById('radarCanvas');
        const ctx = radarCanvas.getContext('2d');
        const cx = radarCanvas.width / 2;
        const cy = radarCanvas.height / 2;
        const radarRadius = cx - 10
